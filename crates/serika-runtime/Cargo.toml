[package]
name = "serika-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Shared agent runtime for Serika Code"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls", "charset", "multipart"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "4", default-features = true }
thiserror = "2"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
regex = "1"
ignore = "0.4"
dunce = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio-util = "0.7"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
