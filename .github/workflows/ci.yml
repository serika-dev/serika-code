name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: macOS (Apple Silicon)
            os: blacksmith-6vcpu-macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: macOS (Intel)
            os: blacksmith-6vcpu-macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - name: Windows (x86_64)
            os: blacksmith-4vcpu-windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'blacksmith-4vcpu-ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libdbus-1-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run workspace unit & integration tests
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --workspace --locked

      - name: Build release binaries
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Smoke-test CLI binary
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            ./target/${{ matrix.target }}/release/serika.exe --version
            ./target/${{ matrix.target }}/release/serika-desktop.exe --version
          else
            ./target/${{ matrix.target }}/release/serika --version
            ./target/${{ matrix.target }}/release/serika-desktop --version
          fi

      - name: Package release archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/serika-code-${{ matrix.target }}.tar.gz serika serika-desktop

      - name: Package release archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path `
            "target/${{ matrix.target }}/release/serika.exe", `
            "target/${{ matrix.target }}/release/serika-desktop.exe", `
            "install.ps1" `
            -DestinationPath "dist/serika-code-${{ matrix.target }}.zip" -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: serika-code-${{ matrix.target }}
          path: dist/*
