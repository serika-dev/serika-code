name: Official Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0)
        required: false
        default: v0.1.0

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    name: Create GitHub Release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Ensure GitHub Release exists
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name != 'main' && github.ref_name || inputs.tag }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --title "Serika Code ${TAG}" \
              --generate-notes \
              --latest
          fi
          gh release upload "${TAG}" install.sh install.ps1 --clobber

  build:
    name: Release ${{ matrix.name }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: macOS (Apple Silicon)
            os: blacksmith-6vcpu-macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: macOS (Intel)
            os: blacksmith-6vcpu-macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - name: Windows (x86_64)
            os: blacksmith-4vcpu-windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'blacksmith-4vcpu-ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libdbus-1-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run workspace tests
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --workspace --locked

      - name: Build release binaries
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Package and upload Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          mkdir -p dist staging
          cp target/${{ matrix.target }}/release/serika staging/
          cp target/${{ matrix.target }}/release/serika-desktop staging/
          cp install.sh README.md LICENSE staging/
          ARCHIVE="serika-code-${{ matrix.target }}.tar.gz"
          tar -C staging -czf "dist/${ARCHIVE}" .
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          fi
          gh release upload "${TAG}" "${ARCHIVE}" "${ARCHIVE}.sha256" --clobber

      - name: Package and upload Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path dist, staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/serika.exe" staging/
          Copy-Item "target/${{ matrix.target }}/release/serika-desktop.exe" staging/
          Copy-Item "install.ps1", "README.md", "LICENSE" staging/
          $archive = "serika-code-${{ matrix.target }}.zip"
          Compress-Archive -Path "staging/*" -DestinationPath "dist/$archive" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$archive").Hash.ToLower()
          "$hash  $archive" | Out-File -FilePath "dist/$archive.sha256" -Encoding ascii -NoNewline
          "`n" | Out-File -FilePath "dist/$archive.sha256" -Encoding ascii -Append -NoNewline
          gh release upload $env:TAG "dist/$archive" "dist/$archive.sha256" --clobber

  finalize-checksums:
    name: Publish SHA256SUMS
    needs: [prepare-release, build]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Assemble and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          mkdir -p sums
          cd sums
          gh release download "${TAG}" -p "*.sha256" -p "install.sh" -p "install.ps1"
          cat *.sha256 > SHA256SUMS
          sha256sum install.sh install.ps1 >> SHA256SUMS
          cat SHA256SUMS
          gh release upload "${TAG}" SHA256SUMS --clobber
